name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealer
          POSTGRES_PASSWORD: dealer
          POSTGRES_DB: dealership_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dealer -d dealership_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://dealer:dealer@localhost:5433/dealership_test?schema=public
      TEST_DATABASE_URL: postgresql://dealer:dealer@localhost:5433/dealership_test?schema=public
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:cov
      - run: npm run test:e2e
