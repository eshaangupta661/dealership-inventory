services:
  postgres-dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealer
      POSTGRES_PASSWORD: dealer
      POSTGRES_DB: dealership
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealer
      POSTGRES_PASSWORD: dealer
      POSTGRES_DB: dealership_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
  postgres_test_data:
